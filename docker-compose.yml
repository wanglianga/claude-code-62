services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-funeral}
      POSTGRES_USER: ${POSTGRES_USER:-funeral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funeral123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 数据库端口不发布到宿主，仅 compose 内网互访
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funeral} -d ${POSTGRES_DB:-funeral}"]
      interval: 8s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-funeral}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-funeral}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-funeral123}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # 后端端口不发布到宿主，仅 compose 内网（经前端 nginx 反代 /api）

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      # 仅发布应用端口；宿主端口由环境变量 CC_PUBLISH_PORT 指定，避免并行任务端口冲突
      - "${CC_PUBLISH_PORT}:8080"
    restart: unless-stopped

volumes:
  pgdata:
